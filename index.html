<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4D35">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Sổ chi nguyên liệu</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>
:root{
  --bg:#F2F5EC; --surface:#FFFFFF; --surface2:#E8EEE0; --ink:#17241B; --muted:#5E6D61; --line:#DAE2D2;
  --hero:#1F4D35; --hero-ink:#F0F7EC; --hero-chip:rgba(255,255,255,.13); --hero-glow:#2D6A4A;
  --primary:#1F4D35; --primary-ink:#F0F7EC; --sel:#E3EFD9;
  --paid:#15785A; --paid-soft:#DCF1E7; --owe:#C2570C; --owe-soft:#FCEADB; --danger:#B42318;
  --gl:36%; --gbg:93%; --gs:52%;
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Bricolage Grotesque','Be Vietnam Pro',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1611; --surface:#16211A; --surface2:#1F2D24; --ink:#E6F0E4; --muted:#92A696; --line:#283A2E;
  --hero:#173A27; --hero-ink:#EAF5E6; --hero-chip:rgba(255,255,255,.10); --hero-glow:#22513A;
  --primary:#86D3A2; --primary-ink:#0E1611; --sel:#1F3A2A;
  --paid:#6FD6A6; --paid-soft:#14372A; --owe:#F4A261; --owe-soft:#3D2716; --danger:#F97066;
  --gl:72%; --gbg:19%; --gs:48%; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1611; --surface:#16211A; --surface2:#1F2D24; --ink:#E6F0E4; --muted:#92A696; --line:#283A2E;
  --hero:#173A27; --hero-ink:#EAF5E6; --hero-chip:rgba(255,255,255,.10); --hero-glow:#22513A;
  --primary:#86D3A2; --primary-ink:#0E1611; --sel:#1F3A2A;
  --paid:#6FD6A6; --paid-soft:#14372A; --owe:#F4A261; --owe-soft:#3D2716; --danger:#F97066;
  --gl:72%; --gbg:19%; --gs:48%; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:8px 200px;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0 12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:12px;background:var(--hero);color:var(--hero-ink);display:grid;place-items:center}
.brand h1{font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:12.5px}
.icon-btn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line)}
.banner{padding:10px 12px;border-radius:12px;font-size:13.5px;margin-bottom:12px;background:var(--owe-soft);color:var(--owe)}
.banner.ok{background:var(--paid-soft);color:var(--paid)}

.hero{position:relative;overflow:hidden;background:var(--hero);color:var(--hero-ink);border-radius:24px;padding:14px 16px 18px;
  background-image:radial-gradient(circle at 105% -20%,var(--hero-glow) 0 34%,transparent 35%),radial-gradient(circle at -10% 120%,var(--hero-glow) 0 22%,transparent 23%)}
.hero-today{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;font-size:13px;opacity:.9;min-height:32px}
.hero-today b{font-weight:600}
.dates{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px 2px}
.dates::-webkit-scrollbar{display:none}
.dchip{flex:none;min-height:48px;min-width:58px;padding:4px 10px;border-radius:14px;background:var(--hero-chip);color:var(--hero-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;font-size:13.5px;font-weight:600}
.dchip small{font-size:11px;font-weight:500;opacity:.75}
.dchip.on{background:var(--hero-ink);color:var(--hero)}
.dpick{position:relative;flex:none;min-height:48px;border-radius:14px;background:var(--hero-chip);display:flex;align-items:center;gap:6px;padding:0 10px;color:var(--hero-ink);font-size:13.5px;font-weight:600}
.dpick.on{background:var(--hero-ink);color:var(--hero)}
.dpick input{border:0;background:transparent;color:inherit;font-size:13.5px;font-weight:600;width:128px;min-height:44px;color-scheme:dark}
.dpick.on input{color-scheme:light}
.amt{display:flex;align-items:flex-end;justify-content:space-between;gap:8px;margin-top:14px}
.amt-l{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;font-weight:600}
.amt-v{font-family:var(--display);font-size:50px;font-weight:800;letter-spacing:-.03em;line-height:1;min-width:0;overflow-wrap:anywhere}
.amt-v i{font-style:normal;font-size:22px;font-weight:600;opacity:.65;margin-left:4px}
.amt-v.empty{opacity:.35}
.amt-x{min-height:40px;padding:0 12px;border-radius:12px;background:var(--hero-chip);color:var(--hero-ink);font-weight:600;font-size:13.5px}
.when{margin-top:6px;font-size:13px;opacity:.85}

.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 4px}
.pad button{min-height:52px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-family:var(--display);font-size:24px;font-weight:700}
.pad button:active{background:var(--sel)}
.pad button.k-del{background:var(--surface2);font-size:20px}

.sec{margin-top:22px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.sec-h h3{font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:-.01em}
.sec-h small{color:var(--muted);font-size:12.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative;min-height:44px;padding:0 14px;border-radius:14px;background:var(--surface);border:1.5px solid var(--line);
  display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:15px}
.chip.on{background:var(--sel);border-color:var(--primary);font-weight:600}
.chip.dash{border-style:dashed;color:var(--muted);background:transparent}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none;margin-left:-6px;
  background:hsl(var(--h) var(--gs) var(--gbg));color:hsl(var(--h) var(--gs) var(--gl))}
.av svg.i{width:16px;height:16px}
.gchip{padding-left:8px}
.gchip .gi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:hsl(var(--h) var(--gs) var(--gbg));color:hsl(var(--h) var(--gs) var(--gl))}
.gchip .gi svg.i{width:18px;height:18px}
.gchip.on{border-color:hsl(var(--h) var(--gs) var(--gl));background:hsl(var(--h) var(--gs) var(--gbg))}
.gchip.on .gi{background:hsl(var(--h) var(--gs) var(--gl));color:var(--surface)}

.pay{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pay button{min-height:76px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px}
.pay button svg.i{width:24px;height:24px;color:var(--muted)}
.pay button.on.t-paid{background:var(--paid-soft);border-color:var(--paid);color:var(--paid)}
.pay button.on.t-owe{background:var(--owe-soft);border-color:var(--owe);color:var(--owe)}
.pay button.on svg.i{color:currentColor}

.field{width:100%;min-height:48px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px}
.field:focus{border-color:var(--primary);outline:none}
textarea.field{padding:10px 14px;min-height:96px;resize:vertical}
.inline{display:flex;gap:8px;margin-top:10px}
.inline .field{flex:1;min-width:0}
.btn{min-height:48px;padding:0 18px;border-radius:14px;background:var(--primary);color:var(--primary-ink);font-weight:600}
.btn.ghosty{background:var(--surface2);color:var(--ink)}
.btn.paid{background:var(--paid);color:var(--surface)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger)}
.btn:disabled{opacity:.4}
.link{color:var(--primary);font-weight:600;font-size:14px;min-height:44px;padding:0 6px}

.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20}
.dock-in{max-width:560px;margin:0 auto}
.savebar{display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-left,0px)) 6px}
.savebar p{flex:1;min-width:0;font-size:13px;color:var(--muted);line-height:1.3}
.savebar p b{display:block;color:var(--ink);font-family:var(--display);font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savebar p span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.savebar .btn{min-width:124px;min-height:52px;font-size:16px;border-radius:16px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:4px max(8px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px))}
.tab{min-height:54px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11.5px;font-weight:500;color:var(--muted);position:relative}
.tab svg.i{width:22px;height:22px}
.tab.on{color:var(--primary);font-weight:700;background:var(--sel)}
.tab em{position:absolute;top:5px;left:calc(50% + 8px);min-width:18px;height:18px;border-radius:9px;background:var(--owe);color:var(--surface);font-style:normal;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}

.group-h{display:flex;justify-content:space-between;align-items:baseline;margin:20px 2px 8px}
.group-h span:first-child{font-family:var(--display);font-weight:700;font-size:16px}
.group-h span:last-child{color:var(--muted);font-size:13.5px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:12px 14px;min-height:60px}
.row+.row{border-top:1px solid var(--line)}
.row .av{margin-left:0;width:36px;height:36px;font-size:14px}
.row .l{min-width:0;flex:1}
.row .l b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .l span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex:none}
.row .r b{display:block;font-weight:700}
.pill{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;margin-top:3px}
.pill.paid{background:var(--paid-soft);color:var(--paid)}
.pill.owe{background:var(--owe-soft);color:var(--owe)}
.empty-s{padding:32px 18px;text-align:center;color:var(--muted)}
.empty-s b{display:block;color:var(--ink);font-family:var(--display);font-size:17px;margin-bottom:4px}

.big{position:relative;overflow:hidden;padding:18px;border-radius:24px;background:var(--hero);color:var(--hero-ink);
  background-image:radial-gradient(circle at 105% -20%,var(--hero-glow) 0 34%,transparent 35%)}
.big small{font-size:13px;opacity:.8;display:block}
.big b{display:block;font-family:var(--display);font-size:38px;font-weight:800;letter-spacing:-.03em;line-height:1.1;margin:4px 0}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{padding:12px;border-radius:16px;background:var(--surface);border:1px solid var(--line);min-width:0}
.tile small{display:block;color:var(--muted);font-size:12px;font-weight:600}
.tile b{display:block;font-family:var(--display);font-size:17px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.tile.owe{background:var(--owe-soft);border-color:transparent} .tile.owe b{color:var(--owe)}
.tile.paid{background:var(--paid-soft);border-color:transparent} .tile.paid b{color:var(--paid)}
.bill{display:flex;gap:12px;align-items:center;padding:10px 14px;min-height:54px;width:100%;text-align:left;border-top:1px solid var(--line)}
.chk{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent}
.chk.on{background:var(--paid);border-color:var(--paid);color:var(--surface)}
.chk svg.i{width:15px;height:15px;stroke-width:3}
.sup-actions{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.sup-actions .btn{flex:1;min-width:130px}
.sub{padding:8px 14px 12px;color:var(--muted);font-size:13px;border-top:1px solid var(--line)}
.filters{display:flex;gap:8px;margin-bottom:4px;flex-wrap:wrap}

.monthbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.monthbar b{font-family:var(--display);font-size:20px;font-weight:700}
.bars{display:flex;align-items:flex-end;gap:2px;height:96px;padding:12px 14px 0}
.bars i{flex:1;background:var(--paid);border-radius:4px 4px 0 0;min-width:2px;opacity:.85}
.bars i.z{background:var(--line);opacity:1}
.bars i.t{opacity:1;background:var(--hero)}
.bars-ax{display:flex;justify-content:space-between;padding:6px 14px 12px;font-size:12px;color:var(--muted)}
.hb{display:flex;gap:10px;align-items:center;padding:10px 14px}
.hb+.hb{border-top:1px solid var(--line)}
.hb .gi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;background:hsl(var(--h) var(--gs) var(--gbg));color:hsl(var(--h) var(--gs) var(--gl))}
.hb .gi svg.i{width:18px;height:18px}
.hb .m{flex:1;min-width:0}
.hb .m div{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.hb .m span{display:block;height:6px;border-radius:3px;background:var(--surface2);margin-top:6px;overflow:hidden}
.hb .m span i{display:block;height:100%;background:hsl(var(--h) var(--gs) var(--gl))}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:10px 6px}
td{padding:10px 6px;text-align:right;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td:first-child{max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
td.owe{color:var(--owe);font-weight:700}
.scroll-x{overflow-x:auto}
.acts{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.acts .btn{flex:1;min-width:150px}

.scrim{position:fixed;inset:0;background:rgba(6,14,9,.55);z-index:40;display:none}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:24px 24px 0 0;max-height:88%;overflow-y:auto;
  padding:10px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:none}
.sheet.open{display:block}
.sheet::before{content:"";display:block;width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheet-in{max-width:560px;margin:0 auto}
.sheet h2{font-family:var(--display);font-size:21px;font-weight:700;margin-bottom:2px}
.sheet .sub0{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.sheet label{display:block;font-size:12.5px;color:var(--muted);margin:14px 0 6px;font-weight:600}
.sheet .stack{display:grid;gap:8px;margin-top:18px}
.sheet .seg2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .seg2 button{min-height:48px;border-radius:14px;border:1.5px solid var(--line);font-weight:600}
.sheet .seg2 button.on{background:var(--paid-soft);border-color:var(--paid);color:var(--paid)}
.x{margin-left:4px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dock-h,150px) + 12px);z-index:60;width:max-content;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;display:none;align-items:center;gap:14px;font-size:14px}
.toast.open{display:flex}
.toast button{color:var(--bg);font-weight:700;min-height:32px;white-space:nowrap;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:no-preference){.sheet.open{animation:up .2s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.4}}
  .amt-v.pop{animation:pop .12s ease-out}@keyframes pop{from{transform:scale(.97)}}}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
</style>

<div class="wrap">
  <div class="top" id="top"></div>
  <div id="banner"></div>
  <main id="view"></main>
</div>
<div class="dock" id="dock"><div class="dock-in"><div id="savebar"></div><nav class="tabs" id="tabs"></nav></div></div>
<div class="scrim" id="scrim" data-act="sheetClose"></div>
<div class="sheet" id="sheet"><div class="sheet-in" id="sheet-in"></div></div>
<div class="toast" id="toast"><span id="toast-msg"></span><button id="toast-btn" data-act="toastAct" hidden></button></div>

<script>
/* ---------- tiện ích ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>new Intl.NumberFormat('vi-VN').format(Math.round(n||0));
const money=n=>fmt(n)+' đ';
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
const today=()=>ymd(new Date());
const parseD=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmtDate=s=>s.slice(8,10)+'/'+s.slice(5,7);
const ymKey=d=>Number(d.slice(0,4))*100+Number(d.slice(5,7));
const WD=['CN','T2','T3','T4','T5','T6','T7'];
const WDL=['Chủ nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const dayLabel=s=>{if(s===today())return 'Hôm nay';if(s===addDays(today(),-1))return 'Hôm qua';return WDL[parseD(s).getDay()]+', '+fmtDate(s)};
const ymLabel=ym=>'Tháng '+Number(ym.slice(5))+'/'+ym.slice(0,4);
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').toLowerCase().trim().replace(/\s+/g,' ');
const digits=s=>String(s||'').replace(/\D/g,'');
const hueOf=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const byDate=(a,b)=>a.date<b.date?-1:a.date>b.date?1:(a.ts||0)-(b.ts||0);
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);

const P={
  leaf:'<path d="M5 19c0-8 6-14 14-14 0 8-6 14-14 14z"/><path d="M5 19l8-8"/>',
  mush:'<path d="M3.5 11.5a8.5 6.5 0 0 1 17 0z"/><path d="M9.5 11.5v6a2.5 2.5 0 0 0 5 0v-6"/>',

function debts(){
  const m=new Map();
  for(const t of allTx()){
    const r=rem(t);if(r<1)continue;
    const k=t.supId||('n:'+t.sup);let e=m.get(k);
    if(!e){e={key:k,name:t.sup,debt:0,bills:[]};m.set(k,e)}
    e.debt+=r;e.bills.push(t);
  }
  for(const e of m.values())e.bills.sort(byDate);
  return [...m.values()].sort((a,b)=>b.debt-a.debt);
}

function load(){
  try{
    const d=JSON.parse(localStorage.getItem(KEY)||'null');
    if(d){
      (d.tx||[]).forEach(t=>S.tx.set(t.id,t));
      (d.sup||[]).forEach(s=>S.sup.set(s.id,s));
      S.pays=d.pays||[];S.groups=d.groups||null;S.dirty=!!d.dirty;
    }
  }catch(e){}
  try{Object.assign(S.cfg,JSON.parse(localStorage.getItem(CFGK)||'{}'))}catch(e){}
}
function writeLocal(){
  try{localStorage.setItem(KEY,JSON.stringify({tx:allTx(),sup:[...S.sup.values()],pays:S.pays,groups:S.groups,dirty:S.dirty}))}
  catch(e){toast('Bộ nhớ máy đầy, hãy đồng bộ sớm')}
}

/* ---------- đồng bộ với Google Sheet qua Apps Script ---------- */
function syncErr(e){
  if(e&&e.message==='timeout')return 'Mạng chậm, sẽ tự thử lại.';
  if(e instanceof TypeError)return 'Không kết nối được Apps Script. Kiểm tra link kết thúc bằng /exec và quyền "Anyone".';
  return 'Chưa đồng bộ được: '+((e&&e.message)||'lỗi')+'.';
}
async function syncNow(){
  if(S.syncing||!S.dirty)return;
  if(!S.cfg.url||!S.cfg.pin){S.syncMsg='Chưa kết nối Google Sheet. Mở Cài đặt để nhập địa chỉ và mã PIN.';refresh();return}
  S.syncing=true;S.dirty=false;
  const body={pin:S.cfg.pin,action:'sync',
    tx:allTx().sort(byDate).map(t=>[t.id,t.date,ymKey(t.date),t.sup,(t.cats||[]).join(', '),t.note||'',t.amount,Math.min(t.paid||0,t.amount),rem(t),METHOD[t.method]||'']),
    pays:[...S.pays].sort(byDate).map(p=>[p.id,p.date,p.sup,p.amount,METHOD[p.method]||'']),
    sup:[...S.sup.values()].map(s=>s.name).sort((a,b)=>a.localeCompare(b,'vi'))};
  try{
    const r=await withTimeout(fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}),20000);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'lỗi');
    S.syncMsg='';S.lastSync=Date.now();
  }catch(e){S.dirty=true;S.syncMsg=syncErr(e)}
  finally{S.syncing=false}
  writeLocal();refresh();
}
async function pullNow(){
  if(S.syncing||!S.cfg.url||!S.cfg.pin)return;
  S.syncing=true;
  try{
    const r=await withTimeout(fetch(S.cfg.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({pin:S.cfg.pin,action:'load'})}),20000);
    const j=await r.json();
    if(!j.ok)throw new Error(j.error||'lỗi');
    mergeRemote(j);
    S.syncMsg='';S.lastSync=Date.now();
  }catch(e){S.syncMsg=syncErr(e)}
  finally{S.syncing=false}
  writeLocal();refresh();
}
function methodKey(label){return Object.keys(METHOD).find(k=>METHOD[k]===label)||'tm'}
function mergeRemote(j){
  for(const n of j.sup||[]){
    if(!n||[...S.sup.values()].some(s=>norm(s.name)===norm(n)))continue;
    const id=uid('s');S.sup.set(id,{id,name:n,uses:0,ts:Date.now()});
  }
  const supIdOf=name=>{const s=[...S.sup.values()].find(x=>norm(x.name)===norm(name));return s?s.id:(norm(name)===norm(LE.name)?LE.id:null)};
  for(const r of j.tx||[]){
    const [id,date,,sup,cats,note,amount,paid,,method]=r;
    if(S.tx.has(id))continue;
    S.tx.set(id,{id,date,ts:Date.parse(date)||Date.now(),supId:supIdOf(sup),sup,cats:cats?String(cats).split(', ').filter(Boolean):[],note:note||'',amount:Number(amount)||0,paid:Number(paid)||0,method:methodKey(method)});
  }
  for(const r of j.pays||[]){
    const [id,date,sup,amount,method]=r;
    if(S.pays.some(p=>p.id===id))continue;
    S.pays.push({id,date,ts:Date.parse(date)||Date.now(),supKey:supIdOf(sup)||'n:'+sup,sup,amount:Number(amount)||0,method:methodKey(method)});
  }
}
setInterval(()=>{if(S.dirty)syncNow();else pullNow()},60000);

function dayStats(day){
  let sum=0,n=0;
  for(const t of allTx())if(t.date===day){sum+=t.amount;n++}
  return {sum,n};
}

}
function metaLine(t){return [(t.cats||[]).join(', '),t.note].filter(Boolean).join(' · ')||METHOD[t.method]||''}

function viewSo(){
  let list=allTx().sort((a,b)=>byDate(b,a));
  if(S.filter==='no')list=list.filter(t=>rem(t)>=1);
  if(S.filter==='tm')list=list.filter(t=>t.method==='tm');
  const fl=`<div class="filters">${[['all','Tất cả'],['no','Chưa trả'],['tm','Tiền mặt']].map(([k,n])=>`<button class="chip ${S.filter===k?'on':''}" data-act="filter" data-v="${k}">${n}</button>`).join('')}</div>`;
  if(!list.length)return fl+`<div class="card" style="margin-top:12px"><div class="empty-s"><b>Chưa có khoản nào</b>Vào tab Ghi để thêm khoản chi đầu tiên.</div></div>`;
  const shown=list.slice(0,S.limit);let html='',cur='',tot=0,buf='';
  const flushGroup=()=>{if(cur)html+=`<div class="group-h"><span>${esc(dayLabel(cur))}</span><span class="num">${money(tot)}</span></div><div class="card">${buf}</div>`};
  for(const t of shown){
    if(t.date!==cur){flushGroup();cur=t.date;tot=0;buf=''}
    tot+=t.amount;
    buf+=`<button class="row" data-act="openTx" data-v="${esc(t.id)}">${avatar(t.sup)}<div class="l"><b>${esc(t.sup)}</b><span>${esc(metaLine(t))}</span></div><div class="r"><b class="num">${money(t.amount)}</b>${pill(t)}</div></button>`;
  }
  flushGroup();
  if(list.length>shown.length)html+=`<div class="acts"><button class="btn ghosty" data-act="more">Xem thêm</button></div>`;
  return fl+html;
}

      body=d.bills.map(b=>`<button class="bill" data-act="toggleBill" data-v="${esc(b.id)}"><span class="chk ${S.sel.has(b.id)?'on':''}">${ic('tick')}</span>

        <span class="num" style="font-weight:700">${money(rem(b))}</span></button>`).join('');
      body+=`<div class="sup-actions"><button class="btn ghosty" data-act="selAll" data-v="${esc(d.key)}">${selB.length===d.bills.length?'Bỏ chọn':'Chọn tất cả'}</button>
        <button class="btn paid" data-act="paySheet" data-v="${esc(d.key)}">${selB.length?'Trả '+money(selSum):'Trả nợ'}</button></div>`;
      const ps=[...S.pays].reverse().filter(p=>p.supKey===d.key).slice(0,3);
      if(ps.length)body+=`<div class="sub">Lần trả gần đây: ${ps.map(p=>fmtDate(p.date)+' '+money(p.amount)).join(' · ')}</div>`;
    }
    return `<div class="card" style="margin-top:10px"><button class="row" data-act="openSup" data-v="${esc(d.key)}">${avatar(d.name)}<div class="l"><b>${esc(d.name)}</b><span>${d.bills.length} khoản · cũ nhất ${age<=0?'hôm nay':age+' ngày trước'}</span></div>
      <div class="r"><b class="num" style="color:var(--owe)">${money(d.debt)}</b></div></button>${body}</div>`;
  }).join('');
  return head+cards;
}

function monthData(ym){
  const list=allTx().filter(t=>t.date.startsWith(ym));
  const total=list.reduce((s,t)=>s+t.amount,0),paid=list.reduce((s,t)=>s+Math.min(t.paid||0,t.amount),0);
  const bySup=new Map(),byCat=new Map();
  for(const t of list){
    let e=bySup.get(t.sup);if(!e){e={name:t.sup,buy:0,paid:0};bySup.set(t.sup,e)}
    e.buy+=t.amount;e.paid+=Math.min(t.paid||0,t.amount);
    const cs=t.cats&&t.cats.length?t.cats:['Chưa phân nhóm'];
    for(const c of cs)byCat.set(c,(byCat.get(c)||0)+t.amount/cs.length);
  }
  const [y,m]=ym.split('-').map(Number),dim=new Date(y,m,0).getDate(),days=Array(dim).fill(0);
  for(const t of list)days[Number(t.date.slice(8,10))-1]+=t.amount;
  return {list,total,paid,owe:total-paid,
    sup:[...bySup.values()].sort((a,b)=>b.buy-a.buy),
    cat:[...byCat.entries()].sort((a,b)=>b[1]-a[1]),days,dim};
}

function resetForm(){S.form={amount:'',supId:null,newSup:false,cats:new Set(),method:S.form.method,date:S.form.date,note:''}}

function saveTx(){
  const f=S.form,amt=Number(f.amount||0);
  if(!(amt>0)||!f.supId)return;
  const paid=f.method==='no'?0:amt;
  const rec={id:uid('t'),date:f.date,ts:Date.now(),supId:f.supId,sup:supName(f.supId),cats:[...f.cats],note:f.note.trim(),amount:amt,paid,method:f.method};
  const sup=S.sup.get(f.supId);if(sup){sup.uses=(sup.uses||0)+1;sup.last=Date.now();sup.lastMethod=f.method}
  S.tx.set(rec.id,rec);
  const id=rec.id,name=rec.sup,day=f.date;
  resetForm();
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  toast('Đã ghi '+money(amt)+' · '+name+(day!==today()?' · '+fmtDate(day):''),{label:'Hoàn tác',fn:()=>undoTx(id),ms:7000});
  save();window.scrollTo(0,0);
}
function undoTx(id){S.tx.delete(id);save();toast('Đã hoàn tác')}

function addSupplier(name){
  name=name.trim();if(!name)return null;
  const n=norm(name),ex=[...S.sup.values()].find(s=>norm(s.name)===n);
  if(ex)return ex.id;
  if(n===norm(LE.name))return LE.id;
  const id=uid('s');
  S.sup.set(id,{id,name,uses:0,ts:Date.now()});
  save();
  return id;
}

function payFifo(key,amount,method,billIds){
  const d=debts().find(x=>x.key===key);if(!d)return;
  const bills=d.bills.filter(b=>!billIds.length||billIds.includes(b.id));
  const cap=bills.reduce((s,b)=>s+rem(b),0);
  amount=Math.min(amount,cap);if(!(amount>0))return;
  let left=amount;
  for(const b of bills){
    if(left<1)break;
    const give=Math.min(rem(b),left);
    b.paid=(b.paid||0)+give;left-=give;
  }
  S.pays.push({id:uid('p'),date:today(),ts:Date.now(),supKey:key,sup:d.name,amount,method});
  S.sel.clear();closeSheet();save();
  toast('Đã ghi trả '+money(amount)+' cho '+d.name);
}

function monthText(ym){
  const d=monthData(ym);
  return [ymLabel(ym),`Tổng mua: ${money(d.total)} · Đã trả: ${money(d.paid)} · Còn nợ: ${money(d.owe)}`,'','Theo nhà cung cấp:',
    ...d.sup.map(s=>`- ${s.name}: mua ${money(s.buy)}, đã trả ${money(s.paid)}${s.buy-s.paid>=1?', còn nợ '+money(s.buy-s.paid):''}`),'','Theo nhóm hàng:',
    ...d.cat.map(([n,v])=>`- ${n}: ${money(v)}`)].join('\n');
}
function monthCsv(ym){
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Ngày','NCC','Nhóm hàng','Ghi chú','Số tiền','Đã trả','Còn nợ','Hình thức']];
  for(const t of monthData(ym).list.sort(byDate))
    rows.push([t.date,t.sup,(t.cats||[]).join('; '),t.note||'',t.amount,Math.min(t.paid||0,t.amount),rem(t),METHOD[t.method]||'']);
  return '﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n');
}
function download(name,text){
  const url=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(url);a.remove()},1000);
  toast('Đã tải file');
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Đã sao chép, dán vào Zalo hoặc ghi chú')}

}

document.addEventListener('click',async ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,v=el.dataset.v,f=S.form;
  switch(a){
    case 'tab':S.tab=v;closeSheet();render();window.scrollTo(0,0);return;
    case 'key':{let x=f.amount;if(v==='del')x=x.slice(0,-1);else x=(x+v).replace(/^0+/,'');if(x.length>10)return;f.amount=x;render();const av=$('#amt-v');if(av)av.classList.add('pop');return}
    case 'clearAmt':f.amount='';break;
    case 'pickDate':f.date=v;break;
    case 'pickSup':{f.supId=v;const s=S.sup.get(v);f.method=v===LE.id?'tm':(s&&s.lastMethod)||f.method;break}
    case 'newSupToggle':f.newSup=!f.newSup;render();if(f.newSup){const i=$('#in-newsup');if(i)i.focus()}return;
    case 'addSup':{const i=$('#in-newsup');const id=addSupplier(i?i.value:'');if(id){f.supId=id;f.newSup=false;if(id===LE.id)f.method='tm'}break}
    case 'toggleCat':f.cats.has(v)?f.cats.delete(v):f.cats.add(v);break;
    case 'method':f.method=v;break;
    case 'save':return saveTx();
    case 'toastAct':{const fn=toastFn;$('#toast').classList.remove('open');if(fn)fn();return}
    case 'filter':S.filter=v;S.limit=120;break;
    case 'more':S.limit+=120;break;
    case 'openTx':return openTxSheet(v);
    case 'sheetClose':return closeSheet();
    case 'saveEdit':{
      const t=S.tx.get(v);if(!t)return;
      const amt=Number(digits($('#e-amt').value));if(!(amt>0)){toast('Số tiền chưa đúng');return}
      const fullyPaid=rem(t)<1;
      t.amount=amt;t.date=($('#e-date')&&$('#e-date').value)||t.date;
      t.note=$('#e-note')?$('#e-note').value.trim():(t.note||'');
      t.paid=fullyPaid?amt:Math.min(t.paid||0,amt);
      closeSheet();save();toast('Đã cập nhật');return}
    case 'markPaid':{
      const t=S.tx.get(v);if(!t)return;
      t.paid=t.amount;closeSheet();save();toast('Đã đánh dấu đã trả');return}
    case 'delTx':
      if(el.dataset.armed){S.tx.delete(v);closeSheet();save();toast('Đã xóa');return}
      el.dataset.armed='1';el.textContent='Bấm lần nữa để xóa hẳn';el.style.background='var(--danger)';el.style.color='var(--surface)';return;
    case 'openSup':S.openSup=S.openSup===v?null:v;S.sel.clear();break;
    case 'toggleBill':S.sel.has(v)?S.sel.delete(v):S.sel.add(v);break;
    case 'selAll':{const d=debts().find(x=>x.key===v);if(!d)return;const all=d.bills.every(b=>S.sel.has(b.id));d.bills.forEach(b=>all?S.sel.delete(b.id):S.sel.add(b.id));break}
    case 'paySheet':return openPaySheet(v);
    case 'payMethod':if(S.sheet){S.sheet.method=v;document.querySelectorAll('[data-act="payMethod"]').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}return;
    case 'payConfirm':{
      const sh=S.sheet;if(!sh||sh.type!=='pay')return;
      const amt=Number(digits($('#p-amt').value));if(!(amt>0)){toast('Nhập số tiền trả');return}
      return payFifo(sh.key,amt,sh.method,sh.ids)}
    case 'ymPrev':{const [y,m]=S.ym.split('-').map(Number);S.ym=ymd(new Date(y,m-2,1)).slice(0,7);break}
    case 'ymNext':{if(S.ym>=today().slice(0,7))return;const [y,m]=S.ym.split('-').map(Number);S.ym=ymd(new Date(y,m,1)).slice(0,7);break}
    case 'copySum':return copyText(monthText(S.ym));
    case 'exportCsv':return download('chi-nguyen-lieu-'+S.ym+'.csv',monthCsv(S.ym));
    case 'settings':return openSettings(false);
    case 'saveCfg':{
      let url=($('#cfg-url').value||'').trim(),pin=($('#cfg-pin').value||'').trim();
      if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)){toast('Địa chỉ phải dạng https://script.google.com/…/exec');return}
      if(!pin){toast('Nhập mã PIN');return}
      S.cfg={url,pin};
      try{localStorage.setItem(CFGK,JSON.stringify(S.cfg))}catch(e){}
      S.dirty=true;closeSheet();toast('Đang đồng bộ…');pullNow().then(syncNow);return}
    case 'delSup':
      if(el.dataset.armed){S.sup.delete(v);if(S.form.supId===v)S.form.supId=null;save();openSettings(false);return}
      el.dataset.armed='1';el.textContent='Chắc chắn xóa?';return;
    case 'addManySup':{
      const names=($('#s-new').value||'').split(/\n/).map(x=>x.trim()).filter(Boolean);
      if(!names.length)return;
      for(const n of names)addSupplier(n);
      toast('Đã thêm '+names.length+' NCC');openSettings(false);return}
    case 'addCat':{
      const n=($('#c-new').value||'').trim();if(!n||groups().some(c=>norm(c)===norm(n)))return;
      S.groups=[...groups(),n];save();openSettings(false);return}
    case 'delCat':{S.groups=groups().filter(c=>c!==v);S.form.cats.delete(v);save();openSettings(false);return}
    case 'resetCats':{S.groups=null;save();openSettings(false);return}
  }
  render();
});

});

/* ---------- khởi động ---------- */
function init(){
  load();
  render();
  if(!S.cfg.url)openSettings(true);
  else if(S.dirty)syncNow();
  window.addEventListener('online',syncNow);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.dirty)syncNow()});
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init();
</script>
